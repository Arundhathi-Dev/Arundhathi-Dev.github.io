<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" stroke="#18181b" stroke-width="0.8" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.6" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.5" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.6" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="feedFwd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="feedBack" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Path references for telemetry particle tracking -->
    <path id="pathForward" d="M 152 74 C 188 56, 218 56, 248 74" />
    <path id="pathFeedback" d="M 248 118 C 218 136, 188 136, 154 118" />
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="200" fill="#09090b" />
  <rect width="400" height="200" fill="url(#grid)" />

  <!-- Ambient background glow behind modules -->
  <circle cx="104" cy="96" r="55" fill="#06b6d4" opacity="0.06" />
  <circle cx="299" cy="96" r="55" fill="#a855f7" opacity="0.06" />

  <!-- ================= LEFT: 4x4 ATTENTION MASK WITH MORE CHANGING BLUE TILES ================= -->
  <g transform="translate(62, 54)">
    <!-- Baseline Grid Tiles -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#06b6d4" filter="url(#glowCyan)" />
    <!-- Dynamic changing tile 1 -->
    <rect x="22" y="0" width="18" height="18" rx="3" stroke="#27272a" stroke-width="1.2">
      <animate attributeName="fill" values="#18181b;#3b82f6;#18181b" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="filter" values="none;url(#glowBlue);none" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <rect x="44" y="0" width="18" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
    <!-- Dynamic changing tile 2 -->
    <rect x="66" y="0" width="18" height="18" rx="3" stroke="#27272a" stroke-width="1.2">
      <animate attributeName="fill" values="#3b82f6;#18181b;#3b82f6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="filter" values="url(#glowBlue);none;url(#glowBlue)" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Row 2 -->
    <rect x="0" y="22" width="18" height="18" rx="3" fill="#06b6d4" filter="url(#glowCyan)" />
    <rect x="22" y="22" width="18" height="18" rx="3" fill="#3b82f6" filter="url(#glowBlue)" />
    <rect x="44" y="22" width="18" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1.2" />
    <!-- Dynamic changing tile 3 -->
    <rect x="66" y="22" width="18" height="18" rx="3" stroke="#27272a" stroke-width="1.2">
      <animate attributeName="fill" values="#18181b;#06b6d4;#18181b" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="filter" values="none;url(#glowCyan);none" dur="3.2s" repeatCount="indefinite" />
    </rect>

    <!-- Row 3 -->
    <!-- Dynamic changing tile 4 -->
    <rect x="0" y="44" width="18" height="18" rx="3" stroke="#27272a" stroke-width="1.2">
      <animate attributeName="fill" values="#18181b;#3b82f6;#18181b" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="filter" values="none;url(#glowBlue);none" dur="2.8s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="44" width="18" height="18" rx="3" fill="#06b6d4" filter="url(#glowCyan)" />
    <rect x="44" y="44" width="18" height="18" rx="3" fill="#06b6d4" filter="url(#glowCyan)" />
    <rect x="66" y="44" width="18" height="18" rx="3" fill="#18181b" stroke="#27272a" stroke-width="1.2" />

    <!-- Row 4 -->
    <!-- Dynamic changing tile 5 -->
    <rect x="0" y="66" width="18" height="18" rx="3" stroke="#27272a" stroke-width="1.2">
      <animate attributeName="fill" values="#06b6d4;#18181b;#06b6d4" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="filter" values="url(#glowCyan);none;url(#glowCyan)" dur="3.5s" repeatCount="indefinite" />
    </rect>
    <!-- Dynamic changing tile 6 -->
    <rect x="22" y="66" width="18" height="18" rx="3" stroke="#27272a" stroke-width="1.2">
      <animate attributeName="fill" values="#18181b;#3b82f6;#18181b" dur="3s" repeatCount="indefinite" />
      <animate attributeName="filter" values="none;url(#glowBlue);none" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="44" y="66" width="18" height="18" rx="3" fill="#06b6d4" filter="url(#glowCyan)" />
    <rect x="66" y="66" width="18" height="18" rx="3" fill="#3b82f6" filter="url(#glowBlue)" />

    <!-- Label -->
    <text x="42" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="0.5">SPARSE KERNEL</text>
  </g>

  <!-- ================= RIGHT: ADAPTIVE CONTROLLER ================= -->
  <g transform="translate(254, 52)">
    <rect width="90" height="90" rx="14" fill="#111116" stroke="#27272a" stroke-width="1.4" />
    
    <!-- Threshold Gauge Arc -->
    <path d="M 27 54 A 20 20 0 1 1 63 54" stroke="#27272a" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 27 54 A 20 20 0 0 1 58 35" stroke="#a855f7" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glowPurple)">
      <animate attributeName="stroke-dasharray" values="25,50;45,50;25,50" dur="2.4s" repeatCount="indefinite" />
    </path>
    
    <!-- Needle Pivot & Rotating Needle -->
    <circle cx="45" cy="46" r="4" fill="#c084fc" />
    <g transform="translate(45, 46)">
      <line x1="0" y1="0" x2="11" y2="-10" stroke="#f3e8ff" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-18 0 0; 26 0 0; -18 0 0" dur="2.4s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Labels -->
    <text x="45" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">CONTROLLER</text>
    <text x="45" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="0.5">ONLINE TUNING</text>
  </g>

  <!-- ================= DYNAMIC FEEDBACK LOOP ================= -->
  <!-- Forward Path: Telemetry -->
  <path d="M 152 74 C 188 56, 218 56, 248 74" stroke="url(#feedFwd)" stroke-width="2" stroke-linecap="round" fill="none" />
  <polygon points="244,70 252,76 242,78" fill="#a855f7" />
  <text x="200" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" text-anchor="middle">Sparsity Profile</text>

  <!-- Forward Moving Pulse -->
  <circle r="3" fill="#a855f7" filter="url(#glowPurple)">
    <animateMotion dur="1.6s" repeatCount="indefinite">
      <mpath href="#pathForward" />
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- Backward Path: Feedback Threshold Update -->
  <path d="M 248 118 C 218 136, 188 136, 154 118" stroke="url(#feedBack)" stroke-width="2" stroke-linecap="round" fill="none" />
  <polygon points="158,114 150,120 160,122" fill="#06b6d4" />
  <text x="200" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle">Threshold Update</text>

  <!-- Backward Moving Pulse -->
  <circle r="3" fill="#06b6d4" filter="url(#glowCyan)">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite">
      <mpath href="#pathFeedback" />
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite" />
  </circle>

  <!-- Title -->
  <text x="200" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#f4f4f5" text-anchor="middle" letter-spacing="1.2">ADASPARGE</text>
</svg>