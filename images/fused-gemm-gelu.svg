<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background grid -->
    <pattern id="lightGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" stroke="#f1f5f9" stroke-width="1.2" />
    </pattern>

    <!-- Linear Gradient for fusion/arrow flow -->
    <linearGradient id="fuseFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Glows -->
    <filter id="glowFUSED" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f97316" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Light background matching standard visual container on web -->
  <rect width="400" height="200" fill="#fafbfc" />
  <rect width="400" height="200" fill="url(#lightGrid)" />

  <!-- Background Ambient Glow -->
  <circle cx="310" cy="110" r="45" fill="#f97316" opacity="0.04" />

  <!-- ================= LEFT: GEMM (BLUE MATRIX) ================= -->
  <g transform="translate(36, 60)">
    <!-- Base Node Outer Frame -->
    <rect width="64" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="3" y="3" width="58" height="58" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />

    <!-- Matrix Rows/Cols representing Matrix Multiplications -->
    <path d="M 3 17.5 L 61 17.5 M 3 32 L 61 32 M 3 46.5 L 61 46.5" stroke="#60a5fa" stroke-width="0.8" />
    <path d="M 17.5 3 L 17.5 61 M 32 3 L 32 61 M 46.5 3 L 46.5 61" stroke="#60a5fa" stroke-width="0.8" />

    <!-- Bold highlight pixels on the matrix grid -->
    <rect x="8" y="8" width="6" height="6" rx="1.5" fill="#2563eb" />
    <rect x="22" y="37" width="6" height="6" rx="1.5" fill="#2563eb" />
    <rect x="37" y="22" width="6" height="6" rx="1.5" fill="#2563eb" />

    <text x="32" y="82" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">GEMM</text>
    <text x="32" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Matrix Mult</text>
  </g>

  <!-- ================= MIDDLE-LEFT: + OPERATOR ================= -->
  <g transform="translate(112, 80)">
    <circle cx="12" cy="12" r="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <path d="M 12 7 L 12 17 M 7 12 L 17 12" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ================= MIDDLE: GELU (GREEN ACTIVATION) ================= -->
  <g transform="translate(148, 60)">
    <rect width="64" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <rect x="3" y="3" width="58" height="58" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" />

    <!-- Graph coordinate axis -->
    <path d="M 10 54 L 54 54 M 14 10 L 14 54" stroke="#64748b" stroke-width="0.75" opacity="0.4" />
    
    <!-- GELU Curve (Soft approximation curve) -->
    <path d="M 14 54 C 20 54 26 54 30 46 C 36 34 40 18 50 14" stroke="#059669" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <text x="32" y="82" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.5">GELU</text>
    <text x="32" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Activation</text>
  </g>

  <!-- ================= MOVING DATA FLOW / MERGING ARROW ================= -->
  <g transform="translate(224, 82)">
    <!-- Main Arrow Body -->
    <path d="M 0 10 L 28 10" stroke="url(#fuseFlow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite" />
    </path>
    <polygon points="26,7 34,10 26,13" fill="#f97316" />

    <!-- Animated Data Particles -->
    <circle cx="0" cy="10" r="2" fill="#ef4444">
      <animate attributeName="cx" values="0;28" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ================= RIGHT: FUSED KERNEL (TRITON GPU) ================= -->
  <g transform="translate(270, 48)">
    <rect width="94" height="96" rx="10" fill="#fff" stroke="#fdba74" stroke-width="1.5" filter="url(#glowFUSED)" />
    <!-- Chip styling top banner -->
    <rect x="5" y="5" width="84" height="20" rx="4" fill="#fff7ed" />
    
    <!-- Fusion Badge -->
    <text x="47" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#ea580c" text-anchor="middle" letter-spacing="0.5">FUSED KERNEL</text>

    <!-- Unified Matrix-Curve Icon (GEMM + GELU in single kernel) -->
    <g transform="translate(26, 32)">
      <!-- Tiny Matrix Background -->
      <path d="M 0 0 L 42 0 L 42 42 L 0 42 Z" fill="#fff7ed" stroke="#fed7aa" stroke-width="0.8" />
      <path d="M 0 14 L 42 14 M 0 28 L 42 28 M 14 0 L 14 42 M 28 0 L 28 42" stroke="#ffedd5" stroke-width="0.5" />
      
      <!-- Overlaid GELU Curve -->
      <path d="M 4 38 C 12 38 16 28 22 20 C 28 12 30 6 38 4" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <text x="47" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#ea580c" text-anchor="middle" letter-spacing="0.5">TRITON</text>
  </g>

  <!-- Title Indicator -->
  <text x="200" y="28" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">FUSED GEMM + GELU</text>
  <text x="200" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SINGLE-PASS GPU KERNEL OPTIMIZATION</text>
</svg>