<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle dark grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" stroke="#18181b" stroke-width="0.8" />
    </pattern>

    <!-- Glow filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f43f5e" flood-opacity="0.4" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="400" height="200" fill="#09090b" />
  <rect width="400" height="200" fill="url(#grid)" />

  <!-- Central Scheduler Fulcrum -->
  <g transform="translate(200, 108)">
    <!-- Fulcrum triangle & base -->
    <path d="M 0 -12 L 14 16 L -14 16 Z" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
    <rect x="-30" y="16" width="60" height="3" rx="1.5" fill="#3f3f46" />
    <!-- Scheduler pivot node -->
    <circle cx="0" cy="-12" r="5" fill="#0284c7" filter="url(#glowBlue)" />
    <circle cx="0" cy="-12" r="2.5" fill="#e0f2fe" />
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="1">V1 SCHEDULER</text>
  </g>

  <!-- Dynamic Beam (Tilted: choosing low-cost victim) -->
  <g id="scale-beam">
    <!-- Main lever -->
    <line x1="88" y1="80" x2="312" y2="112" stroke="#3f3f46" stroke-width="3" stroke-linecap="round" />
    
    <!-- Suspension cables -->
    <line x1="88" y1="80" x2="88" y2="98" stroke="#27272a" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="312" y1="112" x2="312" y2="130" stroke="#27272a" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- LEFT SIDE: KEEP / RUNNING (High Recompute Cost / High Progress) -->
    <g transform="translate(88, 98)">
      <rect x="-56" y="0" width="112" height="46" rx="8" fill="#061912" stroke="#059669" stroke-width="1.4" filter="url(#glowGreen)" />
      <!-- Status pill -->
      <circle cx="-38" cy="16" r="3.5" fill="#10b981" />
      <text x="-28" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#34d399">KEEP</text>
      <text x="-38" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#6ee7b7">High Recompute Cost</text>
    </g>

    <!-- RIGHT SIDE: PREEMPT (Low Recompute / High KV Reclaimed) -->
    <g transform="translate(312, 130)">
      <rect x="-56" y="0" width="112" height="46" rx="8" fill="#1c0a0e" stroke="#e11d48" stroke-width="1.4" filter="url(#glowRed)" />
      <!-- Status pill -->
      <circle cx="-38" cy="16" r="3.5" fill="#f43f5e" />
      <text x="-28" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#fb7185">PREEMPT</text>
      <text x="-38" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#fda4af">Max Block Reclaim</text>
    </g>
  </g>

  <!-- Top Simple Title -->
  <text x="200" y="32" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" font-weight="700" fill="#f4f4f5" text-anchor="middle" letter-spacing="1.2">COST-AWARE PREEMPTION</text>
  <text x="200" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#71717a" text-anchor="middle">Victim Selection Heuristic</text>
</svg>